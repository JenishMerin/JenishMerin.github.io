<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jenish Merin — Coming Soon</title>
    <meta name="description" content="Jenish Merin. Portfolio in progress." />
    <meta name="theme-color" content="#07080c" />
    <meta property="og:title" content="Jenish Merin — Coming Soon" />
    <meta property="og:description" content="Portfolio in progress." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jenishmerin.github.io/" />
    <link rel="canonical" href="https://jenishmerin.github.io/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/cormorant-garamond-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="vignette"></div>
      <div class="spotlight"></div>
      <svg class="grain" xmlns="http://www.w3.org/2000/svg">
        <filter id="grainNoise">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#grainNoise)" />
      </svg>
    </div>

    <main class="stage">
      <div class="parallax" data-parallax>
        <div class="floater">
          <p class="speech"><span>Coming soon</span></p>
        </div>
      </div>

      <div class="identity">
        <h1 class="name">Jenish Merin</h1>
        <span class="mark" aria-hidden="true"></span>
        <p class="sub">Portfolio in progress</p>
      </div>
    </main>
    <script src="js/site.js"></script>
  </body>
</html>
